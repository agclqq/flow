server:
  port: 8080

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: flow
  sslmode: disable

cron:
  enabled: false
  schedule: "0 * * * * *"

runtime:
  # FLOW_ENV_OUT 根目录；留空或不可写时使用 /tmp/flow/env/{template_id}/{instance_id}
  env_out_dir: ""

lock:
  provider: db
  cron_leader_type: cron_scheduler_leader
  ttl: 60s
  renew_interval: 20s
  redis:
    addr: ""
    password: ""
    db: 0
    key_prefix: "flow:lock:"
